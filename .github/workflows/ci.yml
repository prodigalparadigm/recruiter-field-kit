name: ci

on:
  push:
  pull_request:

jobs:
  hard-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No network path to LinkedIn
        run: ./tools/check_no_linkedin.sh

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recorded decodes match schema and expectations
        run: ./tools/check_fixtures.sh

  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: references/ matches the prompts in probe.py
        run: python3 tools/export_references.py --check
